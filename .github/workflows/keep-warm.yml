name: Keep backend warm

# Render's Free plan spins the backend down after ~15 min of no traffic, and the
# next visitor then waits ~50s for a cold start. This workflow pings the backend
# every ~10 min so it never idles out — a free alternative to a paid always-on
# plan. (GitHub's scheduler can run late under load; if cold starts still slip
# through, an external monitor like cron-job.org / UptimeRobot at 5-min is more
# reliable. The cleanest fix remains upgrading Render to a paid instance.)

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never pile up overlapping pings.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (wakes it if asleep)
        run: |
          # /health is a @Public liveness+DB check → 200 when up. Pinging it also
          # warms the Prisma connection pool, so the first real request avoids the
          # ~1s DB connect. --max-time 90 tolerates a cold start.
          URL="https://wellness-h8op.onrender.com/api/v1/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not return 200 after 3 attempts."
          exit 1
