# =============================================================================
# api.sirahdigital.in  —  SIRAH LIFE backend (NestJS on 127.0.0.1:3000)
# Install to: /etc/nginx/sites-available/api.sirahdigital.in
# Then:       ln -s ../sites-available/api.sirahdigital.in /etc/nginx/sites-enabled/
#
# Requires the WebSocket upgrade map — install nginx-websocket-map.conf to
# /etc/nginx/conf.d/ (it defines $connection_upgrade). See the runbook.
#
# certbot injects the 443 / ssl_* lines when you run:
#   sudo certbot --nginx -d api.sirahdigital.in
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.sirahdigital.in;

    # Base64 plate photos & uploads flow through JSON (backend cap is 2mb, but
    # multipart uploads can be larger) — leave headroom so nginx doesn't 413.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for the realtime gateway (socket.io). $connection_upgrade
        # is "upgrade" for WS handshakes and "" (close) for normal requests.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;   # long-poll / AI streaming / webhooks
        proxy_send_timeout    300s;
    }
}
