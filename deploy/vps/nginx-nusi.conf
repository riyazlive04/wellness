# =============================================================================
# nusi.sirahagents.com  —  SIRAH LIFE, SINGLE-HOST deployment.
# One hostname serves the frontend AND proxies /api to the backend → no CORS.
# This REPLACES the nginx-app.conf + nginx-api.conf pair (don't use those too).
#
# Install to: /etc/nginx/sites-available/nusi.sirahagents.com
#   sudo ln -sf /etc/nginx/sites-available/nusi.sirahagents.com /etc/nginx/sites-enabled/
# Requires the WebSocket map: nginx-websocket-map.conf → /etc/nginx/conf.d/
#
# certbot injects 443 / ssl_* when you run:
#   sudo certbot --nginx -d nusi.sirahagents.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nusi.sirahagents.com;

    # Vite build output (rebuild with `npm run build` in frontend/)
    root /var/www/sirah/frontend/dist;
    index index.html;

    client_max_body_size 20m;   # headroom for uploads / base64 plate photos

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API + realtime socket → NestJS on 127.0.0.1:3000 -----------------------
    # The socket.io gateway lives at /api/realtime, so this one block covers both
    # REST and WebSocket. Must be declared BEFORE the SPA fallback.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/realtime ($connection_upgrade from the map)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;   # AI streaming / webhooks / long-poll
        proxy_send_timeout    300s;
    }

    # --- Hashed build assets: cache hard (names change every build) -------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Service worker + manifest: never cache, so updates roll out ------------
    location = /sirah-offline-sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /sirah-sw.js        { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /manifest.json      { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # --- SPA fallback: unknown paths serve index.html (client router) -----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
