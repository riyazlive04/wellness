# =============================================================================
# WebSocket upgrade map — required by nginx-api.conf for the realtime gateway.
# Install to: /etc/nginx/conf.d/websocket-map.conf   (http-level; NOT inside a
# server block). Maps the Upgrade header to the right Connection header so that
# socket.io handshakes upgrade while normal REST requests keep keep-alive.
# =============================================================================

# Uniquely named ($sirah_…) so it can't clash with a $connection_upgrade map
# that another app on a shared box may already declare in its own config.
map $http_upgrade $sirah_connection_upgrade {
    default upgrade;
    ''      close;
}
