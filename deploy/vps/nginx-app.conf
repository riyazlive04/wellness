# =============================================================================
# app.sirahdigital.in  —  SIRAH LIFE frontend (static Vite SPA build)
# Install to: /etc/nginx/sites-available/app.sirahdigital.in
# Then:       ln -s ../sites-available/app.sirahdigital.in /etc/nginx/sites-enabled/
#
# certbot will inject the listen 443 / ssl_* lines when you run:
#   sudo certbot --nginx -d app.sirahdigital.in
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.sirahdigital.in;

    # Vite build output. Rebuild with `npm run build` in frontend/.
    root /var/www/sirah/frontend/dist;
    index index.html;

    # gzip text assets (JS/CSS/JSON/SVG)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Hashed build assets: cache hard (filenames change on every build) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Service worker + manifest: NEVER cache, so updates roll out at once ---
    # The app registers /sirah-offline-sw.js (see frontend/src/main.tsx).
    location = /sirah-offline-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /sirah-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- SPA fallback: every unknown path serves index.html (client router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
