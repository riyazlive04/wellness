# =============================================================================
# Serve self-hosted Expo OTA updates for the SIRAH LIFE app.
#
# Paste this block INSIDE the server { ... } for nusi.sirahagents.com, ABOVE the
# SPA catch-all `location / { try_files ... }` (same rule as the /download/
# block — otherwise the SPA fallback swallows it).
#
# The app (app.json → expo.updates.url) polls:
#   https://nusi.sirahagents.com/updates/manifest
# and pulls bundle + assets from /updates/assets. Both proxy to the little
# zero-dependency Node server (ota-server/server.js) on 127.0.0.1:4747, run
# under pm2 as "sirah-ota".
# =============================================================================
location /updates/ {
    proxy_pass http://127.0.0.1:4747;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The JS bundle is ~6 MB; don't let nginx buffer-truncate or time out.
    proxy_read_timeout 120s;
    proxy_buffering off;

    # The manifest MUST NOT be cached — it's how the app learns an update exists.
    # (Assets under /updates/assets are content-hashed and set their own
    # long-lived immutable cache-control from the Node server.)
    proxy_set_header If-Modified-Since "";
}
