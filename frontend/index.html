<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NUSI" />
    <meta name="theme-color" content="#0A0C10" />
    <!-- The .ico must come first: browsers honour an explicit <link rel="icon">
         over /favicon.ico, and this one carries hand-tuned 16-48px frames that
         drop the wordmark (illegible at tab size) and zoom the mark instead.
         Pointing at a large PNG here would throw that away and let the browser
         downscale the full lockup into a smudge. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="any" href="/nusi-mark.png" />
    <!-- Home-screen icon is shown large, so it gets the full lockup. -->
    <link rel="apple-touch-icon" href="/sirah-logo.png" />
    <title>NUSI — A wellness OS for modern healthcare businesses</title>
    <meta name="description" content="NUSI is an AI-native workspace for nutritionists and clinics. Run programs, coach clients with voice and vision AI, and bill effortlessly — all in one calm, elegant platform." />
    <meta name="author" content="Sirah Digital" />

    <meta property="og:title" content="NUSI — A wellness OS for modern healthcare businesses" />
    <meta property="og:description" content="AI-native workspace for nutritionists, wellness clinics, and healthcare coaches. Voice AI, plate-vision macro tracking, automated workflows, GST-compliant billing." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://via.placeholder.com/1200x630/0A0C10/8087FF?text=NUSI" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NUSI" />
    <meta name="twitter:image" content="https://via.placeholder.com/1200x630/0A0C10/8087FF?text=NUSI" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
