<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NUSI" />
    <meta name="theme-color" content="#0A0C10" />
    <!-- The .ico must come first: browsers honour an explicit <link rel="icon">
         over /favicon.ico, and this one carries hand-tuned 16-48px frames that
         drop the wordmark (illegible at tab size) and zoom the mark instead.
         Pointing at a large PNG here would throw that away and let the browser
         downscale the full lockup into a smudge. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="any" href="/nusi-mark.png" />
    <!-- Home-screen icon is shown large, so it gets the full lockup. -->
    <link rel="apple-touch-icon" href="/nusi-logo.png" />
    <!-- Plus Jakarta Sans: clean at the bold weights the app uses everywhere. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <title>Practice Management Software for Nutritionists &amp; Dietitians in India | NUSI</title>

    <meta name="author" content="Sirah Digital" />

    <meta property="og:title" content="Practice Management Software for Nutritionists &amp; Dietitians in India | NUSI" />

    <meta property="og:image" content="https://nusi.in/og-nusi.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NUSI" />
    <meta name="twitter:image" content="https://nusi.in/og-nusi.jpg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
